# era-mb-game.igroteh.su — HTTPS-блок.
# Генерируется certbot'ом после первого выпуска сертификата:
#   sudo certbot --nginx -d era-mb-game.igroteh.su
# В репозитории лежит шаблон; на сервере создаётся deploy/nginx_https_setup.sh.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name era-mb-game.igroteh.su;

    # Заполняется certbot'ом автоматически:
    ssl_certificate     /etc/letsencrypt/live/era-mb-game.igroteh.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/era-mb-game.igroteh.su/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # REST API + админ-API
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_redirect     off;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ActionCable (WebSocket): торговые сессии и лобби
    location /cable {
        proxy_pass         http://127.0.0.1:3001/cable;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
