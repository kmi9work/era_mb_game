name: backend

on:
  push:
    paths: ['era_mobile_api/**', '.github/workflows/backend.yml']
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deploy
          POSTGRES_PASSWORD: gfhjkm
          POSTGRES_DB: era_mobile_api_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      MB_MASTER_KEY: ci-master-key
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: era_mobile_api
      - name: Prepare database
        working-directory: era_mobile_api
        run: |
          bin/rails db:create db:migrate
          bin/rails era_sandbox:install
      - name: RSpec
        working-directory: era_mobile_api
        run: bundle exec rspec
