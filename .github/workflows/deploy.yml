name: deploy-api

# CD: деплой era_mobile_api на epoha-сервер при пуше в main (только серверный код).
on:
  push:
    branches: [main]
    paths:
      - "era_mobile_api/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 62.173.148.168 >> ~/.ssh/known_hosts 2>/dev/null || true
          if ! ssh-keygen -yf ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY невалиден: нужен приватный ключ OpenSSH целиком"
            exit 1
          fi
          echo "KEY FORMAT OK: $(ssh-keygen -lf ~/.ssh/id_ed25519)"

      # STAMP/REL вычисляются НА СЕРВЕРЕ внутри ssh-сессии (GITHUB_ENV туда не дотягивается)
      - name: Prepare release on server
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@62.173.148.168 'set -e
            APP=/opt/era/era_mb_game
            cd $APP/repo || exit 1
            git fetch origin --prune || exit 1
            git checkout -q '"${GITHUB_SHA}"' || exit 1
            REL=$APP/releases/$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}
            mkdir -p "$REL"
            rsync -a --delete --exclude .git --exclude node_modules $APP/repo/era_mobile_api/ "$REL/" || exit 1
            ln -sfn $APP/shared/log "$REL/log"
            ln -sfn $APP/shared/storage "$REL/storage"
            ln -sfn $APP/shared/bundle "$REL/vendor_bundle"
            printf %s "$REL" > /tmp/era_mb_current_rel
            echo "prepared: $REL"'

      - name: Activate release (bundle, migrate, seed, switch)
        run: |
          REL=$(ssh -i ~/.ssh/id_ed25519 deploy@62.173.148.168 'cat /tmp/era_mb_current_rel')
          echo "activating: $REL"
          ssh -i ~/.ssh/id_ed25519 deploy@62.173.148.168 "set -e
            export PATH=\"\$HOME/.rbenv/bin:\$PATH\"
            eval \"\$(rbenv init -)\"
            cd '$REL' || exit 1
            bundle config set --local path /opt/era/era_mb_game/shared/bundle
            bundle install --quiet
            bin/rails db:migrate
            bin/rails db:seed
            ln -sfn '$REL' /opt/era/era_mb_game/current
            echo activated: '$REL'"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@62.173.148.168 '
            sudo -n systemctl restart era-mb-game era-mb-game-sidekiq || {
              echo "::error::нет NOPASSWD на systemctl era-mb-game* — проверь sudoers.d";
              exit 1;
            }
            sleep 2
            systemctl is-active era-mb-game && systemctl is-active era-mb-game-sidekiq'

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s --max-time 5 http://127.0.0.1:3001/api/v1/lobby -o /dev/null -w "%{http_code}" || true)
            if [ "$CODE" = "401" ] || [ "$CODE" = "200" ]; then
              echo "health OK ($CODE)"
              exit 0
            fi
            echo "attempt $i: code=$CODE"; sleep 3
          done
          echo "::error::health check failed"; exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@62.173.148.168 '
            PREV=$(ls -dt /opt/era/era_mb_game/releases/* | sed -n 2p)
            [ -n "$PREV" ] && ln -sfn "$PREV" /opt/era/era_mb_game/current
            sudo -n systemctl restart era-mb-game era-mb-game-sidekiq || true
            echo rolled back to: $PREV' || true
